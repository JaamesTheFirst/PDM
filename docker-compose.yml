version: '3.8'

services:
  # PostgreSQL Database with PostGIS extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sustainable_transport_db
    environment:
      POSTGRES_DB: sustainable_transport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: sustainable_transport_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: sustainable_transport_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sustainable_transport_api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sustainable_transport?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      PORT: 3000
      OTP_BASE_URL: http://otp:8080/otp
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./EXTERNALS:/EXTERNALS
    depends_on:
      - postgres
      - redis
      - otp
    networks:
      - app-network
    restart: unless-stopped
    command: sh -lc "npm ci && npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  otp:
    image: docker.io/opentripplanner/opentripplanner:latest
    container_name: otp
    environment:
      JAVA_TOOL_OPTIONS: -Xmx8g
    volumes:
      - ./EXTERNALS/otp/build:/var/opentripplanner
    ports:
      - "8080:8080"
    command: --load --serve
    networks:
      - app-network
    depends_on: []

volumes:
  postgres_data:
  redis_data:
  mongo_data:

networks:
  app-network:
    driver: bridge
